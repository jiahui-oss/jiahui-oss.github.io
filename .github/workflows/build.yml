name: Build APK with python-for-android

on:
  push:
    branches:
      - xuanjie-app
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: xuanjie-app

      # ============================================================
      # Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # ============================================================
      # Java 17
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # Linux dependencies
      # ============================================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            gettext \
            autopoint

          sudo apt-get clean

      # ============================================================
      # Install python-for-android directly
      #
      # Use the official develop branch.
      # No Buildozer involved.
      # ============================================================
      - name: Install python-for-android
        run: |
          python -m pip install --upgrade pip setuptools wheel

          git clone \
            --depth 1 \
            --branch develop \
            https://github.com/kivy/python-for-android.git \
            "$HOME/python-for-android"

          cd "$HOME/python-for-android"

          python -m pip install .

          echo "========================================"
          echo "python-for-android:"
          echo "========================================"

          p4a --version

      # ============================================================
      # Prepare Android SDK / NDK / prerequisites
      #
      # This uses p4a's own prerequisite installer.
      # ============================================================
      - name: Prepare Android toolchain
        run: |
          cd "$HOME/python-for-android"

          python pythonforandroid/prerequisites.py

      - name: Install Android API 33
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "========================================"
          echo "Installed Android SDK packages"
          echo "========================================"

          "$SDKMANAGER" --list_installed

      # ============================================================
      # Show Android environment
      # ============================================================
      - name: Check Android environment
        run: |
          echo "========================================"
          echo "ANDROID ENVIRONMENT"
          echo "========================================"

          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "ANDROID_HOME:"
          echo "${ANDROID_HOME:-not set}"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "${ANDROID_SDK_ROOT:-not set}"

          echo ""
          echo "ANDROID_NDK_HOME:"
          echo "${ANDROID_NDK_HOME:-not set}"

          echo ""
          echo "SDK directories:"
          find "$HOME/.android" \
            -maxdepth 3 \
            -type d \
            2>/dev/null | head -100 || true

      # ============================================================
      # Build APK directly with python-for-android
      # ============================================================
      - name: Build APK
        run: |
          echo "========================================"
          echo "BUILDING XUANJIE APK"
          echo "python-for-android DIRECT BUILD"
          echo "========================================"

          mkdir -p dist

          p4a apk \
            --private . \
            --package=org.xuanjie.xuanjie \
            --name="玄界" \
            --version=0.1 \
            --bootstrap=sdl2 \
            --requirements="python3,kivy==2.3.1,charset-normalizer==3.3.2" \
            --android-api=33 \
            --ndk-api=24 \
            --arch=arm64-v8a \
            --arch=armeabi-v7a \
            --orientation=portrait \
            --debug

      # ============================================================
      # Find APK
      # ============================================================
      - name: Find APK
        if: success()
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          echo ""
          echo "Searching for APK files..."

          find . \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

      # ============================================================
      # Copy APK to dist/
      # ============================================================
      - name: Collect APK
        if: success()
        run: |
          mkdir -p dist

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./dist/*" \
            -exec cp {} dist/ \;

          echo "========================================"
          echo "DIST"
          echo "========================================"

          ls -lh dist/

      # ============================================================
      # Upload APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: xuanjie-apk
          path: dist/*.apk
          if-no-files-found: error

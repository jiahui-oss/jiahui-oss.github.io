name: Build APK

on:
  push:
    branches: [xuanjie-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xuanjie-app

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev \
            automake libltdl-dev

      - name: Install buildozer
        run: pip install buildozer cython

      - name: Cache buildozer & android
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Prepare Android env
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Build APK
        run: yes | buildozer -v android debug
        timeout-minutes: 60
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xuanjie-apk
          path: bin/*.apk

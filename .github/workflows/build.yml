- name: Configure buildozer.spec
  run: |
    python - <<'PY'
    from pathlib import Path

    path = Path("buildozer.spec")
    text = path.read_text()

    settings = {
        "android.api": "33",
        "android.ndk": "25b",
        "android.build_tools_version": "33.0.0",
        "android.accept_sdk_license": "True",

        "p4a.fork": "kivy",
        "p4a.branch": "develop",
        "p4a.commit": "0382d27",
    }

    lines = text.splitlines()

    for key, value in settings.items():
        found = False

        for i, line in enumerate(lines):
            stripped = line.lstrip()

            if stripped.startswith("#"):
                stripped = stripped[1:].lstrip()

            if stripped.startswith(key + " ="):
                prefix = line[:len(line) - len(line.lstrip())]
                lines[i] = f"{prefix}{key} = {value}"
                found = True
                break

        if not found:
            lines.append(f"{key} = {value}")

    path.write_text("\n".join(lines) + "\n")
    PY

    grep -E \
      "android.api|android.ndk|android.build_tools_version|p4a.fork|p4a.branch|p4a.commit" \
      buildozer.spec || true

- name: Clean Buildozer state
  run: |
    rm -rf "$HOME/.buildozer"
    rm -rf .buildozer

- name: Build APK
  run: |
    yes | buildozer -v android debug
  timeout-minutes: 60
  env:
    PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

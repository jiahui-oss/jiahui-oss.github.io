name: Build APK

on:
  push:
    branches:
      - xuanjie-app
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # ============================================================
      # 官方 Buildozer CI：Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: xuanjie-app

      # ============================================================
      # 官方 Buildozer CI：Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # ============================================================
      # 官方 Buildozer CI：Java 17
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      # ============================================================
      # Linux dependencies
      # 官方 CI 明确安装的依赖
      # ============================================================
      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt -y install \
            automake \
            libltdl-dev

      # ============================================================
      # 安装 Buildozer
      # ============================================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer

          echo "========================================"
          echo "Python:"
          python --version

          echo "========================================"
          echo "pip:"
          python -m pip --version

          echo "========================================"
          echo "Buildozer:"
          buildozer --version

      # ============================================================
      # 使用官方方式准备 SDK / NDK / p4a
      # ============================================================
      - name: Setup Android build environment
        run: |
          sed -i.bak \
            "s/# android.accept_sdk_license = False/android.accept_sdk_license = True/" \
            buildozer.spec

          sed -i.bak \
            "s/#p4a.branch = master/p4a.branch = develop/" \
            buildozer.spec

          echo "========================================"
          echo "Buildozer configuration:"
          echo "========================================"

          grep -E \
            "^(title|package.name|package.domain|requirements|android.api|android.minapi|android.sdk|android.ndk|android.archs|android.accept_sdk_license|p4a.branch)" \
            buildozer.spec || true

          echo "========================================"
          echo "Preparing python-for-android..."
          echo "========================================"

          buildozer android p4a -- --help

      # ============================================================
      # 清理旧构建状态
      # ============================================================
      - name: Clean build state
        run: |
          rm -rf .buildozer
          rm -rf "$HOME/.buildozer"

      # ============================================================
      # 正式构建 APK
      # ============================================================
      - name: Build APK
        run: |
          echo "========================================"
          echo "BUILDING XUANJIE APK"
          echo "========================================"

          buildozer android debug

      # ============================================================
      # 显示 APK
      # ============================================================
      - name: Show APK
        if: success()
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

      # ============================================================
      # 上传 APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: xuanjie-apk
          path: bin/*.apk
          if-no-files-found: error

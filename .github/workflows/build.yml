name: Build APK

on:
  push:
    branches:
      - xuanjie-app
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: xuanjie-app


      # ============================================================
      # 2. Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"


      # ============================================================
      # 3. Android Java
      # ============================================================
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. Install system dependencies
      # ============================================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-dev \
            python3-pip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            gettext \
            autopoint

          sudo apt-get clean


      # ============================================================
      # 5. Upgrade pip tools
      #
      # 保留之前针对 Buildozer / p4a 的稳定版本
      # ============================================================
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade \
            pip==23.3.2 \
            setuptools==69.0.0 \
            wheel==0.42.0

          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.36


      # ============================================================
      # 6. Clean old Buildozer state
      #
      # 防止之前失败的 p4a / recipe / NDK 缓存干扰本次构建
      # ============================================================
      - name: Clean Buildozer state
        run: |
          echo "============================================================"
          echo "CLEANING BUILDOZER STATE"
          echo "============================================================"

          rm -rf "$HOME/.buildozer"
          rm -rf ".buildozer"

          mkdir -p "$HOME/.buildozer"

          echo "Clean complete."


      # ============================================================
      # 7. Download / initialize python-for-android
      #
      # 这一步故意先执行。
      # Buildozer 会把 p4a 下载到：
      #
      # .buildozer/android/platform/python-for-android
      #
      # 然后我们才能修 libthorvg recipe。
      # ============================================================
      - name: Prepare python-for-android
        run: |
          echo "============================================================"
          echo "PREPARING PYTHON-FOR-ANDROID"
          echo "============================================================"

          buildozer android p4a -- --help

          P4A_DIR=".buildozer/android/platform/python-for-android"
          RECIPE="$P4A_DIR/pythonforandroid/recipes/libthorvg/__init__.py"

          echo ""
          echo "P4A directory:"
          echo "$P4A_DIR"

          echo ""
          echo "Checking libthorvg recipe..."

          if [ ! -f "$RECIPE" ]; then
            echo "ERROR: libthorvg recipe was not found."
            echo "Expected:"
            echo "$RECIPE"
            exit 1
          fi

          echo "Found:"
          echo "$RECIPE"

          echo ""
          echo "Original recipe section:"
          grep -n -A8 -B5 "clang_lib_dir" "$RECIPE" || true


      # ============================================================
      # 8. Patch libthorvg
      #
      # 当前 recipe 寻找：
      #
      # lib/clang/*/lib/linux/aarch64
      #
      # NDK 25b 实际使用：
      #
      # lib64/clang/14.0.6/lib/linux/aarch64
      #
      # 因此把：
      #
      # lib/clang/*
      #
      # 改成：
      #
      # lib*/clang/*
      #
      # 这样 lib 和 lib64 都能匹配。
      # ============================================================
      - name: Patch libthorvg recipe
        run: |
          echo "============================================================"
          echo "PATCHING LIBTHORVG"
          echo "============================================================"

          RECIPE=".buildozer/android/platform/python-for-android/pythonforandroid/recipes/libthorvg/__init__.py"

          if [ ! -f "$RECIPE" ]; then
            echo "ERROR: libthorvg recipe not found."
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          recipe = Path(
              ".buildozer/android/platform/python-for-android/"
              "pythonforandroid/recipes/libthorvg/__init__.py"
          )

          text = recipe.read_text()

          old = (
              'pattern = join('
              'self.ctx.ndk.llvm_prebuilt_dir, '
              '"lib/clang/*/lib/linux", '
              'lib_arch)'
          )

          new = (
              'pattern = join('
              'self.ctx.ndk.llvm_prebuilt_dir, '
              '"lib*/clang/*/lib/linux", '
              'lib_arch)'
          )

          if old not in text:
              print("Expected libthorvg pattern was not found.")

              print("\nSearching for related code:\n")

              for line_no, line in enumerate(text.splitlines(), 1):
                  if "llvm_prebuilt_dir" in line or "clang_lib_dir" in line:
                      print(f"{line_no}: {line}")

              raise SystemExit(
                  "ERROR: libthorvg recipe format is different from expected."
              )

          text = text.replace(old, new, 1)

          recipe.write_text(text)

          print("libthorvg recipe patched successfully.")
          PY

          echo ""
          echo "Patched recipe section:"
          grep -n -A8 -B5 "clang_lib_dir" "$RECIPE"


      # ============================================================
      # 9. Verify NDK / Clang path
      #
      # 这一段不是修改，只是把实际目录打印出来。
      # 如果以后又出问题，可以直接看到 NDK 到底是什么结构。
      # ============================================================
      - name: Verify Android NDK environment
        run: |
          echo "============================================================"
          echo "VERIFYING NDK ENVIRONMENT"
          echo "============================================================"

          P4A_DIR=".buildozer/android/platform/python-for-android"

          echo ""
          echo "Searching for libomp.so..."

          find "$P4A_DIR" \
            -path "*clang*/lib/linux/*/libomp.so" \
            -print 2>/dev/null | head -20 || true

          echo ""
          echo "Buildozer directory:"
          find ".buildozer/android/platform" \
            -maxdepth 3 \
            -type d \
            -name "toolchains" \
            -print 2>/dev/null || true


      # ============================================================
      # 10. Build APK
      # ============================================================
      - name: Build APK
        run: |
          echo "============================================================"
          echo "BUILDING APK"
          echo "============================================================"

          echo "Buildozer version:"
          buildozer --version

          echo ""
          echo "Python version:"
          python --version

          echo ""
          echo "Starting Android build..."

          yes | buildozer -v android debug

        timeout-minutes: 60

        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"


      # ============================================================
      # 11. Show generated APK
      # ============================================================
      - name: Show APK
        if: success()
        run: |
          echo "============================================================"
          echo "GENERATED APK FILES"
          echo "============================================================"

          find bin -maxdepth 1 -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print -exec ls -lh {} \;


      # ============================================================
      # 12. Upload APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: xuanjie-apk
          path: bin/*.apk
          if-no-files-found: error

name: Build APK

on:
  push:
    branches:
      - xuanjie-app
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: xuanjie-app


      # ============================================================
      # 2. Python 3.10
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"


      # ============================================================
      # 3. Java 17
      # ============================================================
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. Install system dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            gettext \
            autopoint

          sudo apt-get clean


      # ============================================================
      # 5. Python build tools
      # ============================================================
      - name: Install Buildozer
        run: |
          python -m pip install \
            pip==23.3.2 \
            setuptools==69.0.0 \
            wheel==0.42.0

          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.36

          echo "Python:"
          python --version

          echo "Buildozer:"
          buildozer --version


      # ============================================================
      # 6. Clean old build state
      # ============================================================
      - name: Clean build state
        run: |
          rm -rf "$HOME/.buildozer"
          rm -rf ".buildozer"

          mkdir -p "$HOME/.buildozer"
          mkdir -p "$HOME/.android"

          touch "$HOME/.android/repositories.cfg"


      # ============================================================
      # 7. Check buildozer.spec
      # ============================================================
      - name: Check build configuration
        run: |
          echo "============================================================"
          echo "BUILDOZER CONFIGURATION"
          echo "============================================================"

          grep -E \
            "^(title|package.name|requirements|android.api|android.minapi|android.sdk|android.ndk|android.archs|android.accept_sdk_license|p4a.version)" \
            buildozer.spec || true

          echo ""
          echo "Checking that p4a.version=latest is absent..."

          if grep -q "^p4a.version[[:space:]]*=" buildozer.spec; then
            echo "ERROR: p4a.version is still present."
            exit 1
          fi

          echo "OK."


      # ============================================================
      # 8. Build APK
      #
      # SDK / NDK / p4a / licenses are handled by Buildozer.
      # 不再手动碰 .buildozer。
      # ============================================================
      - name: Build APK
        run: |
          echo "============================================================"
          echo "BUILDING XUANJIE APK"
          echo "============================================================"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Starting Android build..."
          echo ""

          yes | buildozer -v android debug

        timeout-minutes: 70

        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"


      # ============================================================
      # 9. Show APK
      # ============================================================
      - name: Show APK
        if: success()
        run: |
          echo "============================================================"
          echo "APK OUTPUT"
          echo "============================================================"

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;


      # ============================================================
      # 10. Upload APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: xuanjie-apk
          path: bin/*.apk
          if-no-files-found: error
